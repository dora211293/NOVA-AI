<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#04060d">
<title>NOVA — ASSISTANT</title>
<style>
:root{--bg:#04060d;--p:rgba(10,20,40,.66);--p2:rgba(14,26,52,.86);--line:rgba(120,190,255,.17);--ink:#e8f4ff;--sub:#7f94b6;--a:#4de1ff;--a2:#7b6bff;--ok:#4dffb0;--bad:#ff6b8a;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;--glow:0 0 18px color-mix(in srgb,var(--a) 30%,transparent)}
:root[data-accent=violet]{--a:#a78bff;--a2:#ff6bd6}
:root[data-accent=amber]{--a:#ffc14d;--a2:#ff7a4d}
:root[data-accent=green]{--a:#4dffb0;--a2:#4de1ff}
:root[data-accent=pink]{--a:#ff6bb5;--a2:#ffb36b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;overscroll-behavior:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 45% at 50% -5%,color-mix(in srgb,var(--a) 20%,transparent),transparent 70%),radial-gradient(60% 40% at 100% 100%,color-mix(in srgb,var(--a2) 16%,transparent),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 72%)}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;height:var(--vh,100dvh);max-width:780px;margin:0 auto}
svg{display:block}
/* header */
header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 6px}
.core{width:54px;height:54px;flex:none;overflow:visible}
.core circle{fill:none;stroke:var(--a);stroke-width:1.4;transform-origin:center;transform-box:fill-box}
.r1{stroke-dasharray:3 7;opacity:.75;animation:rot 18s linear infinite}
.r2{stroke:var(--a2)!important;stroke-dasharray:34 12;animation:rot 9s linear infinite reverse}
.r3{stroke-dasharray:10 6 2 6;animation:rot 5s linear infinite}
.core .dot{fill:var(--a);stroke:none;filter:drop-shadow(0 0 6px var(--a));animation:pulse 2.4s ease-in-out infinite}
body[data-state=think] .r1{animation-duration:3s}body[data-state=think] .r2{animation-duration:1.8s}body[data-state=think] .r3{animation-duration:1s}body[data-state=think] .dot{animation-duration:.7s}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}
.core .dot{transform-origin:center;transform-box:fill-box}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font:700 20px var(--mono);letter-spacing:.38em;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--a) 40%,transparent))}
.ttl small{display:block;font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:7px;box-shadow:0 0 8px var(--ok);vertical-align:1px}
.hb{width:44px;height:44px;border:1px solid var(--line);background:var(--p);color:var(--a);border-radius:14px;display:grid;place-items:center;cursor:pointer}
.hb svg{width:20px;height:20px}
#pgline{height:2px;margin:0 14px;background:transparent;overflow:hidden;border-radius:2px}
#pgline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));box-shadow:0 0 10px var(--a);transition:width .3s}
/* HUD panel */
#hud{margin:6px 12px 4px;padding:12px 14px;border:1px solid var(--line);background:var(--p);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;position:relative}
#hud::before,#hud::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--a);filter:drop-shadow(0 0 4px var(--a))}
#hud::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
#hud::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.clk{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;cursor:pointer}
#time{font:300 40px/1 var(--mono);letter-spacing:.04em;text-shadow:0 0 18px color-mix(in srgb,var(--a) 55%,transparent)}
#time small{font-size:18px;color:var(--a);margin-left:4px}
#time .c{animation:bl 1s steps(1) infinite;color:var(--a)}
#date{font:500 12px var(--mono);letter-spacing:.1em;color:var(--sub);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;max-height:200px;transition:max-height .35s ease,margin .35s,opacity .35s;overflow:hidden}
#hud.min .tiles{max-height:0;margin-top:0;opacity:0}
.tile{position:relative;text-align:left;padding:8px 10px 9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);border-radius:12px;font:inherit;cursor:pointer;overflow:hidden}
.tile:active{background:color-mix(in srgb,var(--a) 14%,transparent)}
.tile .k{display:block;font:600 9.5px var(--mono);letter-spacing:.18em;color:var(--sub)}
.tile .v{display:block;font:600 14px/1.3 var(--mono);color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.ok{color:var(--ok)}.tile .v.bad{color:var(--bad)}
.tile i{position:absolute;left:0;bottom:0;height:2px;width:100%;background:transparent}
.tile i b{display:block;height:100%;width:0;background:var(--a);box-shadow:0 0 8px var(--a);transition:width .4s}
/* feed */
#log{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 14px 6px;scroll-behavior:smooth;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 10px),transparent);mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 10px),transparent)}
#log::-webkit-scrollbar{display:none}
.row{margin:0 0 14px;animation:in .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row.me{display:flex;justify-content:flex-end}
.me .b{max-width:86%;padding:8px 14px;border:1px solid color-mix(in srgb,var(--a) 45%,transparent);background:color-mix(in srgb,var(--a) 10%,transparent);border-radius:14px 14px 3px 14px;font:14px/1.5 var(--mono);box-shadow:var(--glow);word-break:break-word;white-space:pre-wrap}
.me .b::before{content:"› ";color:var(--a)}
.card{position:relative;max-width:96%;padding:11px 14px 12px;background:var(--p);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:4px 16px 16px 16px}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--a);filter:drop-shadow(0 0 4px var(--a))}
.card::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.tag{display:flex;align-items:center;gap:7px;font:600 10.5px var(--mono);letter-spacing:.22em;color:var(--a);margin-bottom:5px}
.tag svg{width:14px;height:14px}
.txt{white-space:pre-wrap;word-break:break-word}
.txt:empty{display:none}
.card.live .txt::after{content:"▍";color:var(--a);animation:bl 1s steps(1) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.chip{border:1px solid color-mix(in srgb,var(--a) 50%,transparent);background:transparent;color:var(--a);padding:8px 13px;min-height:38px;border-radius:999px;font:600 12.5px var(--mono);letter-spacing:.04em;cursor:pointer}
.chip:active{background:color-mix(in srgb,var(--a) 20%,transparent)}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:14px}.eq i{width:3px;background:var(--a);border-radius:1px;animation:eq 1s ease-in-out infinite;box-shadow:0 0 6px var(--a)}.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.kvs{margin-top:6px}.kv{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.kv:last-child{border:0}
.kv span{font:600 10px var(--mono);letter-spacing:.16em;color:var(--sub);align-self:center;flex:none}.kv b{font-weight:600;text-align:right;word-break:break-word}
.pw{font:600 17px var(--mono);letter-spacing:.04em;word-break:break-all;color:var(--ok);text-shadow:0 0 10px color-mix(in srgb,var(--ok) 40%,transparent);margin-top:6px}
/* dock + input */
.dock{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.q{flex:none;display:flex;align-items:center;gap:7px;padding:0 13px;min-height:40px;border:1px solid var(--line);background:var(--p);color:var(--ink);border-radius:12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.q svg{width:16px;height:16px;color:var(--a)}
.q:active{background:color-mix(in srgb,var(--a) 16%,transparent)}
form{display:flex;align-items:flex-end;gap:8px;margin:0 12px calc(env(safe-area-inset-bottom,0px) + 10px);padding:6px 6px 6px 16px;border:1px solid color-mix(in srgb,var(--a) 42%,transparent);background:var(--p2);border-radius:28px;box-shadow:var(--glow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pr{align-self:center;color:var(--a);font:700 16px var(--mono)}
textarea{flex:1;min-width:0;resize:none;max-height:120px;min-height:44px;border:0;background:transparent;color:var(--ink);padding:10px 0;font:inherit;font-size:16px;line-height:1.45;outline:none}
textarea::placeholder{color:var(--sub)}
#send{width:46px;height:46px;border:0;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--a),var(--a2));color:#04060d;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 16px color-mix(in srgb,var(--a) 50%,transparent);transition:transform .15s,opacity .2s}
#send svg{width:20px;height:20px;stroke-width:2.2}
#send:active{transform:scale(.9)}#send:disabled{opacity:.4}
/* sheets */
#scrim{position:fixed;inset:0;background:rgba(2,4,10,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
body.sh #scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:780px;margin:0 auto;z-index:6;max-height:88%;max-height:88dvh;overflow-y:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(16,28,56,.97),rgba(7,12,26,.99));border:1px solid color-mix(in srgb,var(--a) 35%,transparent);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -12px 50px rgba(0,0,0,.5),0 -1px 24px color-mix(in srgb,var(--a) 22%,transparent);transform:translateY(106%);transition:transform .42s cubic-bezier(.2,.85,.2,1);overscroll-behavior:contain}
.sheet.open{transform:none}
.grip{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.vh{display:flex;align-items:center;gap:9px;color:var(--a);font:700 13px var(--mono);letter-spacing:.24em;margin-bottom:10px}.vh svg{width:18px;height:18px}
.sheet h3{margin:16px 0 8px;font:600 10.5px var(--mono);letter-spacing:.22em;color:var(--sub)}
.in{width:100%;min-height:46px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;outline:none;margin-bottom:8px;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent)}
select.in{appearance:none;-webkit-appearance:none}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--a) 55%,transparent);background:color-mix(in srgb,var(--a) 12%,transparent);color:var(--a);font:600 13px var(--mono);letter-spacing:.08em;cursor:pointer;width:100%}
.btn.pri{background:linear-gradient(135deg,var(--a),var(--a2));color:#04060d;border:0;box-shadow:0 0 16px color-mix(in srgb,var(--a) 40%,transparent)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.note{color:var(--sub);font-size:13px;margin:0 0 12px;white-space:pre-wrap}.err{color:var(--bad);font-size:13px;min-height:20px;margin-bottom:6px}
.sws{display:flex;gap:12px}.sws button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c);box-shadow:0 0 14px var(--c)}.sws button.on{border-color:#fff}
.pl{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.pl div{flex:1;min-width:0}.pl b{display:block;font-size:14.5px}.pl small{color:var(--sub);font-size:12px}
.sw{position:relative;width:50px;height:30px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .25s}.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s}
.sw input:checked+span{background:var(--a);box-shadow:0 0 12px var(--a)}.sw input:checked+span::after{transform:translateX(20px)}
/* vault card */
.vcard{margin-top:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035)}
.vt{display:flex;align-items:center;justify-content:space-between}.vt b{color:var(--a);font-size:15px}
.vr{display:flex;align-items:center;gap:6px;padding:2px 0}.vl{font:600 10px var(--mono);letter-spacing:.1em;color:var(--sub);width:24px;flex:none}
.vv{flex:1;min-width:0;font:14px var(--mono);word-break:break-all}.vn{color:var(--sub);font-size:12.5px;margin-top:2px}
.ibtn{width:38px;height:38px;border:0;background:transparent;color:var(--a);border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}.ibtn svg{width:18px;height:18px}.ibtn:active{background:color-mix(in srgb,var(--a) 18%,transparent)}.ibtn.bad{color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body data-state="idle">
<canvas id="bg"></canvas>
<div id="app">
  <header>
    <svg class="core" viewBox="0 0 64 64"><circle class="r1" cx="32" cy="32" r="29"/><circle class="r2" cx="32" cy="32" r="22"/><circle class="r3" cx="32" cy="32" r="15"/><circle class="dot" cx="32" cy="32" r="6"/></svg>
    <div class="ttl"><b>NOVA</b><small id="st">ASSISTANT SYSTEM // ONLINE</small></div>
    <button class="hb" id="menu" type="button" aria-label="設定"></button>
  </header>
  <div id="pgline"><i></i></div>
  <section id="hud">
    <div class="clk" id="clk"><div id="time">--:--</div><div id="date"></div></div>
    <div class="tiles">
      <button class="tile" type="button" data-go="none"><span class="k">BATTERY</span><span class="v" id="v-batt">--</span><i><b id="b-batt"></b></i></button>
      <button class="tile" type="button" data-go="none"><span class="k">NETWORK</span><span class="v" id="v-net">--</span></button>
      <button class="tile" type="button" data-go="ai"><span class="k">AI CORE</span><span class="v" id="v-ai">--</span><i><b id="b-ai"></b></i></button>
      <button class="tile" type="button" data-go="todo"><span class="k">TASKS</span><span class="v" id="v-todo">--</span></button>
      <button class="tile" type="button" data-go="timer"><span class="k">TIMER</span><span class="v" id="v-timer">--</span></button>
      <button class="tile" type="button" data-go="vault"><span class="k">VAULT</span><span class="v" id="v-vault">--</span></button>
    </div>
  </section>
  <main id="log" aria-live="polite"></main>
  <div class="dock" id="dock"></div>
  <form id="f" autocomplete="off">
    <span class="pr">›</span>
    <textarea id="in" rows="1" placeholder="指示を入力…" enterkeyhint="send"></textarea>
    <button id="send" type="submit" aria-label="送信"></button>
  </form>
</div>
<div id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="設定">
  <div class="grip"></div>
  <div class="vh" id="sh-h"></div>
  <h3>AI CORE（WebLLM）</h3>
  <select id="model" class="in"></select>
  <button class="btn pri" id="boot" type="button">AIコアを起動</button>
  <h3>ACCENT</h3>
  <div class="sws" id="sws"></div>
  <h3>MODULES</h3>
  <div id="pls"></div>
  <h3>DATA</h3>
  <div class="two"><button class="btn" id="vopen" type="button">金庫を開く</button><button class="btn bad" id="clear" type="button">履歴を消去</button></div>
</div>
<div class="sheet" id="vsheet" role="dialog" aria-label="金庫"><div class="grip"></div><div id="vbody"></div></div>

<script>
/* =====================================================================
   NOVA ASSISTANT — 外部API不使用・端末内完結
   ---------------------------------------------------------------------
   【機能の追加方法】
     NOVA.register({
       id:'my', name:'表示名', desc:'説明', tag:'LABEL', icon:'cpu', priority:50,
       match(ctx){ return 0〜1 },            // 最大スコアのプラグインが実行される
       run(ctx){ return '文字列' or {text, chips:[], render:()=>HTMLElement, secret:true} }
     });
   ctx = { raw, text(正規化済), ai, store, onToken(ストリーム出力用) }
   フック: NOVA.use('before'|'after', ctx=>{})
   ===================================================================== */
(()=>{
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const IC={
 cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M19 9h3M19 15h3M2 9h3M2 15h3"/>',
 send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
 sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
 calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
 todo:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L21 2M16 7l3 3M18 5l2 2"/>',
 dice:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
 trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',

const NOVA={
  plugins:[],hooks:{before:[],after:[]},store:Store,timers:[],say:null,llmReady:false,

  use(stage,fn){this.hooks[stage].push(fn);return this},

  norm(s){return s.normalize('NFKC').replace(/×/g,'*').replace(/÷/g,'/').trim()},

  async respond(raw,onToken){

    for(const h of this.hooks.before)await h(ctx);
    let best=null,bs=0;
    for(const p of this.plugins){if(!this.enabled(p.id))continue;let s=0;try{s=+p.match(ctx)||0}catch(e){}if(s>bs){bs=s;best=p}}

    out=typeof out==='string'?{text:out}:out;
    if(best&&!out.tag){out.tag=best.tag||best.id.toUpperCase();out.icon=best.icon||'cpu'}

  }

const Vault={key:null,data:null,salt:'',w:[],adding:false,pre:'',idle:0,
 enc:new TextEncoder(),dec:new TextDecoder(),
 exists(){return !!Store.get('vault',null)},
 b64(u){let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)},
 ub64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))},
 async derive(pass,salt){const km=await crypto.subtle.importKey('raw',this.enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
 async seal(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},this.key,this.enc.encode(JSON.stringify(this.data)));
  Store.set('vault',{v:1,salt:this.salt,iv:this.b64(iv),ct:this.b64(new Uint8Array(ct))})},
 async create(pass){const s=crypto.getRandomValues(new Uint8Array(16));this.salt=this.b64(s);this.key=await this.derive(pass,s);this.data=[];await this.seal();this.opened()},
 async unlock(pass){const v=Store.get('vault',null);const key=await this.derive(pass,this.ub64(v.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.ub64(v.iv)},key,this.ub64(v.ct));
  this.salt=v.salt;this.key=key;this.data=JSON.parse(this.dec.decode(pt));this.opened()},
 opened(){this.touch();this.w.splice(0).forEach(r=>r(true));UI.tiles();UI.vault()},
 touch(){clearTimeout(this.idle);this.idle=setTimeout(()=>this.lock(),180000)},
 lock(){clearTimeout(this.idle);this.key=null;this.data=null;this.adding=false;
  document.querySelectorAll('.vcard.live-secret').forEach(n=>{n.replaceWith(el('div','note','🔒 金庫がロックされたため結果を消去しました。'))});UI.tiles();UI.vault()},
 ensure(){if(this.key){this.touch();return Promise.resolve(true)}return new Promise(r=>{this.w.push(r);UI.sheet('#vsheet')})},
 async add(e){this.data.push(e);await this.seal();this.touch()},
 async del(i){this.data.splice(i,1);await this.seal();this.touch()},

  UI.closeSheets();const r=Vault.find(terms);
  if(!r.length)return{text:`「${terms.join(' ')}」は見つかりませんでした。`,chips:['金庫を開く','アカウントを追加']};
  return{text:`${r.length}件見つかりました。コピーした内容は30秒後にクリップボードから消去します。`,secret:true,render(){const w=el('div');r.forEach(e=>w.appendChild(vcard(e,null,true)));return w}}}});

NOVA.register({id:'knowledge',name:'知識Q&A',desc:'内蔵の知識ベースを類似度検索',tag:'INFO',icon:'cpu',priority:30,
 match(c){let best=0,hit=null;const tb=bi(c.text.toLowerCase());
  for(const e of KB)for(const k of e.k){const s=c.text.toLowerCase().includes(k.toLowerCase())?.9:dice(tb,bi(k.toLowerCase()));if(s>best){best=s;hit=e}}
  c.kb=hit;return best>=(LLM.engine?.85:.4)?best:0},
 run(c){return c.kb.a}});

const log=$('#log'),inp=$('#in'),send=$('#send');
let hist=Store.get('hist',[]),busy=false;
const UI={
 chipsEl(chips){const w=el('div','chips');chips.forEach(t=>{const x=el('button','chip',t);x.type='button';x.onclick=()=>submit(t);w.appendChild(x)});return w},
 clearChips(){log.querySelectorAll('.chips').forEach(e=>e.remove())},
 card(tag,icon,text){const c=el('div','card');const tg=el('div','tag');tg.innerHTML=ic(icon||'cpu');tg.appendChild(document.createTextNode(tag||'NOVA'));c.appendChild(tg);c.appendChild(el('div','txt',text||''));return c},
 msg(role,text,o){o=o||{};this.clearChips();const r=el('div','row '+role);
  if(role==='me')r.appendChild(el('div','b',text));
  else{const c=this.card(o.tag,o.icon,text);if(o.render){const n=o.render();n&&c.appendChild(n)}r.appendChild(c);if(o.chips&&o.chips.length)c.appendChild(this.chipsEl(o.chips))}
  log.appendChild(r);this.bottom();
  if(o.save!==false&&!o.secret){hist.push({r:role,t:text,tag:o.tag,icon:o.icon});hist=hist.slice(-60);Store.set('hist',hist)}return r},
 live(tag,icon){this.clearChips();const r=el('div','row bot');const c=this.card(tag,icon,'');c.classList.add('live');r.appendChild(c);log.appendChild(r);this.bottom();return c},
 finish(c,out){c.classList.remove('live');c.querySelector('.txt').textContent=out.text;hist.push({r:'bot',t:out.text,tag:out.tag,icon:out.icon});hist=hist.slice(-60);Store.set('hist',hist);
  if(out.chips&&out.chips.length)c.appendChild(this.chipsEl(out.chips));this.bottom()},
 bottom(){requestAnimationFrame(()=>{log.scrollTop=log.scrollHeight})},
 typing(on){let e=$('#typ');if(on&&!e){e=el('div','row bot');e.id='typ';const c=this.card('PROCESSING','cpu','');c.querySelector('.txt').innerHTML='<span class="eq"><i></i><i></i><i></i><i></i></span>';c.querySelector('.txt').style.display='block';e.appendChild(c);log.appendChild(e);this.bottom()}else if(!on&&e)e.remove();document.body.dataset.state=on?'think':'idle';this.status()},
 status(){$('#st').textContent=LLM.loading?'LOADING MODEL '+Math.round(LLM.pct*100)+'%':busy?'PROCESSING…':LLM.engine?'AI CORE ACTIVE // ONLINE':'ASSISTANT SYSTEM // ONLINE'},
 progress(p){LLM.pct=p;$('#pgline i').style.width=Math.round(p*100)+'%';this.status();this.tiles();if(p>=1)setTimeout(()=>{$('#pgline i').style.width='0'},900)},
 tiles(){const set=(id,v,cls)=>{const e=$('#v-'+id);if(!e)return;e.textContent=v;e.className='v'+(cls?' '+cls:'')};
  const b=Sys.batt;set('batt',b?Math.round(b.level*100)+'%'+(b.charging?' ⚡':''):'N/A',b&&b.charging?'ok':b&&b.level<.2?'bad':'');$('#b-batt').style.width=b?Math.round(b.level*100)+'%':'0';
  const n=Sys.net();set('net',n.on?(n.type||'ONLINE'):'OFFLINE',n.on?'ok':'bad');
  set('ai',!navigator.gpu?'NO WEBGPU':LLM.loading?'LOAD '+Math.round(LLM.pct*100)+'%':LLM.engine?'ACTIVE':'STANDBY',LLM.engine?'ok':'');$('#b-ai').style.width=LLM.engine?'100%':LLM.loading?Math.round(LLM.pct*100)+'%':'0';
  set('todo',Store.get('todos',[]).length+' 件');
  const nx=NOVA.timers.length?Math.max(0,Math.round((Math.min(...NOVA.timers.map(t=>t.end))-Date.now())/1000)):-1;
  set('timer',nx<0?'—':p2(Math.floor(nx/60))+':'+p2(nx%60),nx>=0?'ok':'');
  set('vault',!Vault.exists()?'未作成':Vault.key?'OPEN':'LOCKED',Vault.key?'ok':'')},
 plugins(){const off=Store.get('off',[]);const box=$('#pls');box.innerHTML='';
  NOVA.plugins.slice().sort((a,b)=>a.name.localeCompare(b.name,'ja')).forEach(p=>{const d=el('div','pl');
   d.innerHTML='<div><b></b><small></small></div><label class="sw"><input type="checkbox"><span></span></label>';
   d.querySelector('b').textContent=p.name;d.querySelector('small').textContent=p.desc||'';
   const cb=d.querySelector('input');cb.checked=off.indexOf(p.id)<0;
   cb.onchange=()=>{let o=Store.get('off',[]).filter(x=>x!==p.id);if(!cb.checked)o.push(p.id);Store.set('off',o)};box.appendChild(d)})},

/* ---- 金庫シート ---- */
function renderVault(){
 const V=$('#vbody');if(!V||!$('#vsheet').classList.contains('open'))return;V.innerHTML='';
 const h=el('div','vh');h.innerHTML=ic('lock')+'<span>VAULT</span>';V.appendChild(h);
 const mk=(type,ph)=>{const i=el('input','in');i.type=type;i.placeholder=ph;i.autocomplete=type==='password'?'new-password':'off';i.autocapitalize='off';i.spellcheck=false;return i};
 const bt=(t,c)=>{const b=el('button','btn'+(c?' '+c:''),t);b.type='button';return b};
 if(!Vault.exists()){
  V.appendChild(el('p','note','ID・パスワードを端末内に暗号化して保存します（AES-256-GCM）。\nマスターパスワードを設定してください。※忘れると復元できません。'));
  const a=mk('password','マスターパスワード（8文字以上）'),b=mk('password','もう一度入力'),er=el('div','err'),go=bt('金庫を作成','pri');
  go.onclick=async()=>{if(a.value.length<8){er.textContent='8文字以上にしてください';return}if(a.value!==b.value){er.textContent='2つの入力が一致しません';return}go.disabled=true;try{await Vault.create(a.value)}catch(e){er.textContent='作成に失敗しました（HTTPS環境が必要です）';go.disabled=false}};
  V.append(a,b,er,go);setTimeout(()=>a.focus(),350);return}
 if(!Vault.key){
  V.appendChild(el('p','note','マスターパスワードを入力して解除します。'));
  const a=mk('password','マスターパスワード'),er=el('div','err'),go=bt('解除','pri');
  a.autocomplete='current-password';
  const run=async()=>{go.disabled=true;er.textContent='';try{await Vault.unlock(a.value)}catch(e){er.textContent='パスワードが違います';go.disabled=false;a.select()}};
  go.onclick=run;a.onkeydown=e=>{if(e.key==='Enter')run()};
  const imp=bt('バックアップを読込');imp.style.marginTop='10px';imp.onclick=importVault;
  V.append(a,er,go,imp);setTimeout(()=>a.focus(),350);return}
 // unlocked
 const top=el('div','two'),ad=bt(Vault.adding?'閉じる':'＋ 追加','pri'),lk=bt('ロック');
 ad.onclick=()=>{Vault.adding=!Vault.adding;Vault.pre='';renderVault()};lk.onclick=()=>Vault.lock();top.append(ad,lk);V.appendChild(top);
 if(Vault.adding){
  const s=mk('text','サービス名（例: Gmail）'),u=mk('text','ID / メールアドレス'),p=mk('text','パスワード'),n=mk('text','メモ（任意）'),er=el('div','err');
  s.value=Vault.pre||'';u.inputMode='email';p.type='password';
  const g=bt('パスワードを生成');g.style.marginBottom='8px';g.onclick=()=>{p.value=genPw(16);p.type='text'};
  const sv=bt('保存','pri');
  sv.onclick=async()=>{if(!s.value.trim()){er.textContent='サービス名を入力してください';return}if(!u.value&&!p.value){er.textContent='ID またはパスワードを入力してください';return}
   await Vault.add({s:s.value.trim(),u:u.value.trim(),p:p.value,n:n.value.trim()});Vault.adding=false;Vault.pre='';renderVault()};
  V.append(s,u,p,g,n,er,sv);setTimeout(()=>(s.value?u:s).focus(),350)}
 const q=mk('search','検索');q.style.marginTop='12px';V.appendChild(q);
 const list=el('div');V.appendChild(list);
 const draw=()=>{list.innerHTML='';const w=q.value.trim().toLowerCase();let n=0;
  Vault.data.forEach((e,i)=>{if(w&&!(e.s+' '+(e.u||'')).toLowerCase().includes(w))return;n++;list.appendChild(vcard(e,async()=>{await Vault.del(i);renderVault()}))});
  if(!n)list.appendChild(el('p','note',Vault.data.length?'該当なし':'まだ登録がありません。「＋ 追加」から登録できます。'))};
 q.oninput=draw;draw();
 const ft=el('div','two');ft.style.marginTop='14px';const ex=bt('バックアップ書出'),im=bt('バックアップ読込');ex.onclick=exportVault;im.onclick=importVault;ft.append(ex,im);V.appendChild(ft);
 V.appendChild(el('p','note','バックアップは暗号化されたまま保存されます。復号にはマスターパスワードが必要です。'));
}
function exportVault(){const v=Store.get('vault',null);if(!v)return;const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(v)],{type:'application/json'}));a.download='nova-vault-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function importVault(){const f=el('input');f.type='file';f.accept='.json,application/json';
 f.onchange=async()=>{try{const o=JSON.parse(await f.files[0].text());if(!o.salt||!o.iv||!o.ct)throw 0;
  if(Vault.exists()&&!confirm('現在の金庫をバックアップの内容で上書きします。よろしいですか？'))return;
  Store.set('vault',o);Vault.lock()}catch(e){alert('バックアップファイルを読み込めませんでした。')}};f.click()}

/* ---- 送信 ---- */
async function submit(text){
  text=(text||'').trim();if(!text||busy)return;busy=true;send.disabled=true;
  const risky=/(パスワード|password|pass|pw)\s*(は|[:：=])/i.test(text);
  UI.msg('me',risky?'（機密のため履歴に保存しません）'+text:text,{save:!risky});inp.value='';grow();
  UI.typing(true);let live=null;
  const onToken=t=>{if(!live){$('#typ')&&$('#typ').remove();live=UI.live('AI CORE','cpu')}live.querySelector('.txt').textContent=t;UI.bottom()};
  const t0=Date.now();const out=await NOVA.respond(text,onToken);
  if(!live)await new Promise(r=>setTimeout(r,Math.max(0,Math.min(900,300+out.text.length*6)-(Date.now()-t0))));
  UI.typing(false);
  if(live)UI.finish(live,Object.assign({},out,{tag:'AI CORE',icon:'cpu'}));else UI.msg('bot',out.text,out);
  busy=false;send.disabled=false;UI.tiles();
  if(!matchMedia('(pointer:coarse)').matches)inp.focus();
}
const grow=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'};
$('#f').addEventListener('submit',e=>{e.preventDefault();submit(inp.value)});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();submit(inp.value)}});
inp.addEventListener('input',grow);

/* ---- AI 起動 ---- */
async function startAI(){
 if(LLM.engine||LLM.loading)return;
 try{await LLM.load();NOVA.llmReady=true;UI.msg('bot','AIコアが起動しました。自由に指示してください。\n計算・タイマー・TODO・金庫などの機能は、これまでどおり即座に実行します。',{tag:'AI CORE',icon:'cpu',save:false})}
 catch(e){UI.msg('bot','AIコアの起動に失敗しました：'+(e&&e.message||e),{tag:'ERROR',icon:'cpu',chips:['AIを起動'],save:false})}
 finally{UI.status();UI.tiles()}
}

// accent

[['ブリーフィング','sun','send','ブリーフィング'],['タイマー','timer','fill','分タイマー'],['TODO','todo','send','todo一覧'],['金庫','lock','vault'],['PW生成','key','send','パスワード生成'],['サイコロ','dice','send','サイコロ'],['AI','cpu','send','AIを起動']].forEach(([l,i,m,v])=>{

/* ---- 背景パーティクル ---- */
(()=>{const c=$('#bg'),x=c.getContext('2d');let W,H,P=[],C='#4de1ff',raf=0;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const col=()=>{C=getComputedStyle(document.documentElement).getPropertyValue('--a').trim()||'#4de1ff'};
 function rs(){const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);col();
  P=Array.from({length:Math.round(Math.min(60,W*H/15000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.3+.4}))}
 function fr(){x.clearRect(0,0,W,H);x.fillStyle=C;x.strokeStyle=C;
  for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
  for(let i=0;i<P.length;i++){const a=P[i];x.globalAlpha=.65;x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill();
   for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<115){x.globalAlpha=(1-d/115)*.26;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
  x.globalAlpha=1}
 const loop=()=>{fr();raf=requestAnimationFrame(loop)};
 rs();addEventListener('resize',rs);window.addEventListener('accent',col);
 if(rm)fr();else loop();
 document.addEventListener('visibilitychange',()=>{if(rm)return;cancelAnimationFrame(raf);if(!document.hidden)loop()})})();
})();
